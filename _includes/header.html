<header class="site-header">
  <div class="container">
    <a class="brand" href="/" aria-label="Jade Title Services, home">
      {% include logo.svg.html %}
      <span class="brand-words" aria-hidden="true"><span class="brand-jade">JADE</span><span class="brand-ts">TITLE SERVICES</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      Menu
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      {%- for item in site.data.nav.main %}
      {%- include page-exists.html url=item.url -%}
      {%- if exists %}
      <a href="{{ item.url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {%- endif %}
      {%- endfor %}
      <a class="btn btn-primary btn-compact" href="{{ site.data.nav.cta.url }}">{{ site.data.nav.cta.name }}</a>
    </nav>
  </div>
</header>
