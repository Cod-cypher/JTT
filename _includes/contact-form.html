{%- comment -%} Full consultation form (contact page). Fields match the contact artboard. {%- endcomment -%}
<form class="contact-form" id="contact-form" action="{{ site.form_action }}" method="POST" data-jade-form novalidate>
  <div class="field-row">
    <div class="field"><label for="cf-first">First name</label><input id="cf-first" name="firstName" type="text" autocomplete="given-name" required></div>
    <div class="field"><label for="cf-last">Last name</label><input id="cf-last" name="lastName" type="text" autocomplete="family-name" required></div>
  </div>
  <div class="field-row">
    <div class="field"><label for="cf-email">Work email</label><input id="cf-email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="cf-company">Company</label><input id="cf-company" name="company" type="text" autocomplete="organization"></div>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="cf-software">Title software</label>
      <select id="cf-software" name="software" data-label="Title software">
        <option value="">Select one</option>
        {%- for s in site.data.software %}<option>{{ s.name }}</option>{% endfor %}
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label for="cf-service">Service you need</label>
      <select id="cf-service" name="service">
        <option value="">Select one</option>
        {%- for s in site.data.services %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        <option value="multiple">More than one</option>
      </select>
    </div>
  </div>
  <div class="field-row">
    <div class="field"><label for="cf-volume">Files per month</label><input id="cf-volume" name="volume" type="text" inputmode="numeric" data-label="Files per month"></div>
    <div class="field"><label for="cf-phone">Phone (optional)</label><input id="cf-phone" name="phone" type="tel" autocomplete="tel" data-label="Phone"></div>
  </div>
  <div class="field"><label for="cf-message">How can we help?</label><textarea id="cf-message" name="message" rows="5" required></textarea></div>
  <label class="check"><input type="checkbox" name="trial" value="Yes" data-label="Wants a free trial of up to 10 files"><span>I would like to start with a free trial of up to 10 files.</span></label>
  <div class="btn-row"><button class="btn btn-primary" type="submit">Send message</button></div>
  <div data-form-status role="status" tabindex="-1" hidden></div>
  <p class="lead" style="font-size:15px">We reply within 24 hours. What you send us is confidential.</p>
</form>
