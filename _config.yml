# Jade Title Services: Jekyll config.
# GitHub Pages builds this automatically on every push to main.
# Local preview: bundle exec jekyll serve   (see README.md)

title: Jade Title Services
url: https://www.jadetitleservices.com
baseurl: ""
lang: en-US
description: >-
  Outsourced title support for U.S. title companies: title order entry, title search
  preparation, title examination and commitments, and final policies.

# Contact and business facts (PLAN.md section 2). Change them here, not in pages.
phone: "(817) 409-8408"
phone_e164: "+18174098408"
email: info@jadetitleservices.com
founded: "2019"
form_action: https://script.google.com/macros/s/AKfycbxDcGL8gcoI9Pdr-04h3cvCEnSmGR67wY8QXQ2aRGw-Zp1tl1HcHU1IhNaNQrQ5b4S7/exec
ga_id: G-N9HZD2ZLJJ
clarity_id: vlkcwrkk9j

founder:
  name: Ali Abbas Kamran
  job_title: Founder and Senior Title Examiner

og_default: /assets/og/default.png

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

permalink: pretty

defaults:
  - scope: { path: "" }
    values:
      layout: default
  - scope: { path: "", type: posts }
    values:
      layout: article
      permalink: /resources/:title/
      og_image: /assets/og/company.png
  - scope: { path: "services" }
    values:
      og_image: /assets/og/services.png
  - scope: { path: "who-we-serve" }
    values:
      og_image: /assets/og/audience.png
  - scope: { path: "about" }
    values:
      og_image: /assets/og/company.png
  - scope: { path: "contact" }
    values:
      og_image: /assets/og/company.png
  - scope: { path: "faq" }
    values:
      og_image: /assets/og/company.png

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - tools
  - node_modules
